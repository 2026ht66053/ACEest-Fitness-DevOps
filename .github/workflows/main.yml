
name: ACEest Fitness CI Pipeline

on:
  push:
  pull_request:

jobs:
  build-test:
    name: Build, Lint, Docker, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q app.py test_app.py

      - name: Run Ruff lint checks
        run: python -m ruff check app.py test_app.py

      - name: Run unit tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t aceest-fitness:ci .

      - name: Run tests inside Docker image
        run: docker run --rm aceest-fitness:ci python -m pytest -v
